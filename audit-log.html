<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="audit-log-api" content="https://leezsypadtvypdgqgvtk.supabase.co/functions/v1/audit-log-api" />
  <meta name="supabase-anon-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlZXpzeXBhZHR2eXBkZ3FndnRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNTk3MTYsImV4cCI6MjA5NzkzNTcxNn0.kzN9eL5fhbFLECWD4PMPXjTHSYh-KJsbjCcPrwJoaTo" />
  <title>Journal des modifications — édition catalogue</title>
  <link rel="stylesheet" href="catalogue.css?v=20250629-2" />
  <link rel="icon" type="image/png" href="images/logo-artmajeur.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body class="catalogue-standalone" data-editor-tab="audit-log">
  <header class="catalogue-standalone-header">
    <div class="catalogue-standalone-inner catalogue-standalone-header-inner catalogue-standalone-header-inner--logos">
      <a class="catalogue-header-ms" href="index.html" title="Marie Sallantin — accueil">
        <img class="catalogue-header-ms-logo" src="images/logoMS.png" alt="Marie Sallantin" width="240" height="96" />
      </a>
      <div class="catalogue-header-text catalogue-header-text--center">
        <h1>Journal des modifications</h1>
        <p class="catalogue-header-subtitle">Historique des enregistrements et suppressions</p>
      </div>
      <a class="catalogue-header-adagp" href="https://www.adagp.fr" target="_blank" rel="noopener noreferrer" title="ADAGP">
        <img class="catalogue-header-adagp-logo" src="images/ADAGP_logo.png" alt="ADAGP" width="120" height="48" />
      </a>
    </div>
  </header>

  <div id="editor-tabs-mount"></div>

  <div id="audit-login" class="catalogue-login">
    <div class="catalogue-login-box">
      <h1 class="catalogue-login-title">Journal des modifications</h1>
      <p class="catalogue-login-hint">Accès réservé aux administrateurs.</p>
      <fieldset class="catalogue-login-profiles">
        <legend class="catalogue-login-profiles-legend">Profil</legend>
        <label class="catalogue-login-profile">
          <input type="radio" name="editor-role" value="admin" checked />
          <span>Administrateur</span>
        </label>
      </fieldset>
      <label class="catalogue-login-label" for="audit-pass">Mot de passe</label>
      <input type="password" id="audit-pass" class="catalogue-login-input" autocomplete="current-password" />
      <button type="button" id="audit-login-btn" class="catalogue-login-submit">Ouvrir le journal</button>
      <p id="audit-login-error" class="catalogue-login-error" hidden></p>
      <p class="legend-editor-api-hint" id="audit-api-hint"></p>
    </div>
  </div>

  <div id="audit-app" class="catalogue-app" hidden>
    <main class="catalogue-page">
      <div class="catalogue-standalone-inner catalogue-standalone-main">
        <div class="legend-editor-toolbar">
          <p class="catalogue-count" id="audit-count" aria-live="polite">0 entrée(s)</p>
          <button type="button" class="legend-editor-btn" id="audit-reload-btn">Recharger</button>
        </div>
        <p id="audit-status" class="legend-editor-api-hint" aria-live="polite"></p>
        <div class="legend-editor-table-wrap">
          <table class="catalogue-table legend-editor-table audit-log-table">
            <thead>
              <tr>
                <th scope="col">Date / heure</th>
                <th scope="col">Profil</th>
                <th scope="col">Action</th>
                <th scope="col">Enregistrement</th>
                <th scope="col">État avant modification</th>
              </tr>
            </thead>
            <tbody id="audit-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="editor-common.js?v=20250629-2"></script>
  <script src="audit-log.js?v=20250629-2"></script>
</body>
</html>
