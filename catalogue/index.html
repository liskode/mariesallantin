<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Redirection…</title>
  <script>
    (function () {
      var h = location.hostname;
      var q = location.search + location.hash;
      if (h === 'mariesallantin.art' || h === 'www.mariesallantin.art') {
        location.replace('https://catalogue.mariesallantin.art/' + q);
        return;
      }
      if (h === 'catalogue.mariesallantin.art') {
        location.replace(location.origin + '/' + q);
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=https://catalogue.mariesallantin.art/" />
</head>
<body>
  <p><a href="https://catalogue.mariesallantin.art/">Catalogue des œuvres</a></p>
</body>
</html>
